services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost"]

  # Disable frontend service in dev mode, run it locally with npm run dev
  frontend:
    profiles: ["donotstart"]
