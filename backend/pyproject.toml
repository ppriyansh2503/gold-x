[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldx-backend"
version = "0.1.0"
description = "GOLD-X backend infrastructure and data pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "polars",
    "scipy",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg2-binary",
    "httpx",
    "python-dateutil",
    "pydantic-settings"
]
