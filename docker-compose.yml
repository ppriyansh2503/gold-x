services:
  db:
    image: postgres:16-alpine
    container_name: goldx_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-goldx}
      POSTGRES_USER: ${POSTGRES_USER:-goldx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goldx_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goldx}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: goldx_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-goldx}:${POSTGRES_PASSWORD:-goldx_dev}@db:5432/${POSTGRES_DB:-goldx}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-goldx}:${POSTGRES_PASSWORD:-goldx_dev}@db:5432/${POSTGRES_DB:-goldx}
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:5173"]'
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: goldx_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
